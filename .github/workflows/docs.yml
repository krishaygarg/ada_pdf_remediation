name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "remediator/audit/**", "scripts/generate_rule_catalogue.py"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "remediator/audit/**", "scripts/generate_rule_catalogue.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . mkdocs-material

      # The catalogue is generated from the registry and then checked for
      # drift, so a rule added without regenerating the page fails here rather
      # than leaving the documentation quietly wrong.
      - name: Regenerate the rule catalogue
        run: python scripts/generate_rule_catalogue.py

      - name: Fail if the catalogue is out of date
        run: |
          if ! git diff --quiet docs/reference/rules.md; then
            echo "docs/reference/rules.md is stale. Run:"
            echo "  python scripts/generate_rule_catalogue.py"
            git diff docs/reference/rules.md
            exit 1
          fi

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
