name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ruff
        run: pip install "ruff>=0.6"
      - name: Check formatting
        run: ruff format --check --diff .
      - name: Lint
        run: ruff check --output-format=github .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mypy
        run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One macOS leg guards against path and Poppler differences without
          # quadrupling the runtime of the matrix.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler tesseract

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Run tests
        run: |
          pytest --cov=remediator --cov-report=xml --cov-report=term-missing --junitxml=junit.xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: ignore

  conformance:
    name: PDF/UA conformance (veraPDF)
    runs-on: ubuntu-latest
    # The last step publishes the audit as SARIF, which writes a code scanning
    # result and so needs more than the read-only default this workflow sets.
    # Declared per job rather than at the top so the other jobs, none of which
    # upload anything, keep the narrower token.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache veraPDF
        id: verapdf-cache
        uses: actions/cache@v4
        with:
          path: ~/verapdf
          key: verapdf-${{ env.VERAPDF_VERSION }}
        env:
          VERAPDF_VERSION: "1.30.2"

      - name: Install veraPDF
        if: steps.verapdf-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o installer.zip https://software.verapdf.org/rel/verapdf-installer.zip
          unzip -q installer.zip
          jar=$(find . -name 'verapdf-izpack-installer-*.jar' | head -1)
          cat > auto-install.xml <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>$HOME/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar "$jar" auto-install.xml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Report the validator version
        run: $HOME/verapdf/verapdf --version

      - name: Validate produced documents against PDF/UA-1
        env:
          VERAPDF_CLI: /home/runner/verapdf/verapdf
        run: pytest tests/test_conformance.py -v

      - name: Cross-check the audit engine against the reference validator
        env:
          VERAPDF_CLI: /home/runner/verapdf/verapdf
        run: pytest tests/test_audit_differential.py -v

      - name: Audit the sample and export findings as SARIF
        continue-on-error: true
        run: |
          mkdir -p tmp
          remediate-pdf samples/physics/physics.pdf tmp/audited.pdf
          check-compliance tmp/audited.pdf --format sarif --output tmp/audit.sarif

      # Skipped for pull requests from forks: those run with a read-only token
      # whatever the job declares, and code scanning does not accept results
      # from a fork, so attempting the upload only fails a contributor's build
      # for something they cannot authorise. The audit itself still runs above.
      - name: Publish audit findings
        if: >-
          always() && hashFiles('tmp/audit.sarif') != ''
          && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tmp/audit.sarif
          category: pdf-ua-audit

  interface:
    name: Interface accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"

      # A checker only sees what is in the DOM and visible, so pointing one at
      # the interface tests the upload form and nothing else. The progress and
      # report sections carry the actual information, so each state is rendered
      # to its own page and all three are checked.
      - name: Render every interface state
        run: python tests/build_interface_states.py tmp/interface-states

      - name: Serve them
        run: |
          python -m http.server 8000 --directory tmp/interface-states &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/idle.html > /dev/null && break
            sleep 1
          done

      # pa11y rather than @axe-core/cli, which ships a ChromeDriver pinned to a
      # Chrome version the runner does not have. pa11y drives its own Chromium
      # through Puppeteer, so it cannot drift from the environment, and it runs
      # HTML CodeSniffer alongside axe-core for strictly more coverage.
      #
      # A real browser catches what static checks cannot: computed contrast
      # after the cascade, focus order, and accessible names as the
      # accessibility tree actually resolves them.
      - name: Check every state with axe-core and HTML CodeSniffer
        run: |
          for page in idle running report; do
            echo "--- $page"
            npx --yes pa11y@9 \
              --config .pa11y.json \
              --reporter cli \
              "http://127.0.0.1:8000/$page.html"
          done

      - name: Run Lighthouse
        run: npx --yes @lhci/cli@0.14.x autorun --collect.url=http://127.0.0.1:8000/idle.html
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lighthouse/
          if-no-files-found: ignore

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Validate metadata
        run: twine check --strict dist/*
      - name: Verify the console scripts resolve from the built wheel
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          /tmp/probe/bin/remediate-pdf --help > /dev/null
          /tmp/probe/bin/check-compliance --help > /dev/null
          echo "console scripts resolve from a clean install"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, types, test, conformance, interface, build]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs succeeded."
