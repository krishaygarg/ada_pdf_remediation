name: Reading order benchmark

# Runs when the research code or the harness changes, and posts the leaderboard
# on the pull request. Someone implementing an ordering algorithm sees their
# score against the stream-order baseline within a couple of minutes, without
# setting anything up.

on:
  pull_request:
    paths:
      - "remediator/reading_order.py"
      - "remediator/roeval/**"
      - "datasets/**"
      - ".github/workflows/reading-order.yml"
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset to benchmark
        default: datasets/example.jsonl

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the benchmark
        id: benchmark
        run: |
          dataset="${{ github.event.inputs.dataset || 'datasets/example.jsonl' }}"
          ada-ro-bench "$dataset" --format markdown --output benchmark.md
          ada-ro-bench "$dataset" --format json --output benchmark.json
          cat benchmark.md

      - name: Post the leaderboard on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              fs.readFileSync('benchmark.md', 'utf8'),
              '',
              '<sub>Posted by the reading order benchmark. See ' +
              '`docs/planning/layout_reading_order_proposal.md`.</sub>',
              '',
              '<!-- reading-order-benchmark -->',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number });
            // One comment, edited in place. A new comment per push buries the
            // conversation under a wall of near-identical tables.
            const mine = existing.data.find((c) =>
              c.body.includes('<!-- reading-order-benchmark -->'),
            );
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-order-benchmark
          path: |
            benchmark.md
            benchmark.json
          if-no-files-found: ignore
