name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish web directory
        if: steps.creds.outputs.present == 'true'
        run: npx wrangler pages deploy web --project-name ada-pdf-remediator

      - name: Explain skipped deploy
        if: steps.creds.outputs.present != 'true'
        run: |
          echo "Cloudflare Pages deploy skipped because CLOUDFLARE_API_TOKEN or"
          echo "CLOUDFLARE_ACCOUNT_ID is not configured for this repository."
