name: Container

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - pyproject.toml
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, scan and describe the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ada-pdf-remediator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Smoke test the image
        run: |
          docker run --rm ada-pdf-remediator:ci remediate-pdf --help > /dev/null
          docker run --rm ada-pdf-remediator:ci check-compliance --help > /dev/null
          echo "image entry points work"

      - name: Confirm the container does not run as root
        run: |
          user_id=$(docker run --rm ada-pdf-remediator:ci id -u)
          if [ "$user_id" = "0" ]; then
            echo "container runs as root"
            exit 1
          fi
          echo "container runs as uid $user_id"

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ada-pdf-remediator:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Publish scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-container

      - name: Generate a software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: ada-pdf-remediator:ci
          format: spdx-json
          artifact-name: sbom.spdx.json
