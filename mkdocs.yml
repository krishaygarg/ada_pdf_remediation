site_name: ADA PDF Remediator
site_description: Tag PDFs for screen readers and audit the result against PDF/UA-1.
site_url: https://krishaygarg.github.io/ada_pdf_remediation/
repo_url: https://github.com/krishaygarg/ada_pdf_remediation
repo_name: krishaygarg/ada_pdf_remediation
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Honesty: honesty.md
  - Reference:
      - Conformance rules: reference/rules.md
      - Command line: reference/cli.md
      - HTTP API: reference/api.md
  - Research:
      - Reading order: planning/layout_reading_order_proposal.md
      - Alt text: planning/alt_text_research_spec.md
      - Timeline: planning/research_timeline.md

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
