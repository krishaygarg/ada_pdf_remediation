[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-pdf-remediator"
version = "0.1.0"
description = "Automated PDF accessibility remediation & reading order research platform"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ADA PDF Remediator Team"}
]
keywords = ["pdf", "accessibility", "pdf-ua", "wcag", "reading-order", "layout-analysis"]
dependencies = [
    "pikepdf>=8.0.0",
    "pdfplumber>=0.10.0",
    "pdf2image>=1.16.3",
    "PyMuPDF>=1.22.0",
    "pillow>=9.5.0",
    "pdfminer.six>=20221105",
    "pytesseract>=0.3.10"
]

[project.optional-dependencies]
experimental = [
    "ultralytics>=8.0.0",
    "huggingface-hub>=0.16.0"
]

[project.scripts]
remediate-pdf = "remediate_pdf:main"
check-compliance = "check_compliance:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["remediator*"]
